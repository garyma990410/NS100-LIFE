<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>百歲人生：平衡之路｜數位版</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>:root{
  --paper:#FFFFFF;--gridline:#E3EAF1;--panel:#FFFFFF;--ink:#1F2A44;--sub:#5B6678;--line:#1F2A44;--soft:#EEF3F8;
  --navy:#00428E;--blue:#0064B9;--sky:#00A3E9;--green:#6DB33F;--greenT:#3F7F14;--yel:#F9BE00;--yelT:#8A5A00;--teal:#339598;--red:#E2483D;
  --hFill:#7FBE26;--fFill:#F9BE00;--mFill:#0064B9;
  --safe:#E6F2D9;--low:#FAD4CF;--high:#FFE7A6;--note:#FFF4C2;
  --shadow:4px 4px 0 var(--ink);--shadowS:3px 3px 0 var(--ink);--r:14px;
  --grad:linear-gradient(90deg,#F9BE00 0%,#7FBE26 33%,#339598 66%,#0064B9 100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1622;--gridline:#1C2636;--panel:#172131;--ink:#E7EDF5;--sub:#A7B3C4;--line:#C9D4E3;--soft:#1E2A3D;--navy:#8CC4FF;--blue:#5AA8F0;--sky:#62C8F5;--greenT:#9BD66A;--yelT:#FFD45C;--safe:#1E3320;--low:#4A2522;--high:#4A3A14;--note:#3A3415;--shadow:4px 4px 0 #000;--shadowS:3px 3px 0 #000}}
:root[data-theme="dark"]{--paper:#0F1622;--gridline:#1C2636;--panel:#172131;--ink:#E7EDF5;--sub:#A7B3C4;--line:#C9D4E3;--soft:#1E2A3D;--navy:#8CC4FF;--blue:#5AA8F0;--sky:#62C8F5;--greenT:#9BD66A;--yelT:#FFD45C;--safe:#1E3320;--low:#4A2522;--high:#4A3A14;--note:#3A3415;--shadow:4px 4px 0 #000;--shadowS:3px 3px 0 #000}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:32px 32px;min-height:100dvh;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
:root{padding-top:env(safe-area-inset-top,0px)}
body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(8px + env(safe-area-inset-bottom,0px));background:var(--grad);z-index:40}
.fun{font-family:"Huninn","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:10px 14px}
/* 頂欄 */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(4px);border-bottom:2px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;padding:7px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--navy);font-size:18px;border:0;background:none;padding:0}
.brand small{font-weight:700;color:var(--sub);font-size:12px}
.sp{flex:1}
/* 貼紙按鈕 */
.btn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 13px;font-size:14px;font-weight:800;box-shadow:var(--shadowS);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--yel);color:#1F2A44}
.btn.blue{background:var(--blue);color:#fff}
.btn.on{background:var(--hFill);color:#1F2A44}
.btn.big{padding:11px 20px;font-size:17px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--panel);border:2.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
h2{margin:0 0 6px;font-size:21px;color:var(--navy);font-weight:900} h3{margin:0 0 6px;font-size:16px;color:var(--navy);font-weight:900}
.muted{color:var(--sub);font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadowS);background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 13px;font-weight:800;border-right:2px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 9px;max-width:100%}
textarea{width:100%;min-height:76px}
.dot{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:900;font-size:12px;border:2px solid var(--line);flex:none}
.tag{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;border:2px solid var(--line);background:var(--panel)}
.tag.red{background:var(--red);color:#fff} .tag.gold{background:var(--yel);color:#1F2A44} .tag.teal{background:var(--teal);color:#fff}
/* 首頁 */
.hero{display:grid;grid-template-columns:1fr;align-items:center;overflow:hidden;padding:14px 18px}
@media(min-width:760px){.hero{grid-template-columns:1fr minmax(0,46%)}}
.hero .art svg{display:block;width:100%;height:auto;max-height:230px}
.hero .t span{display:inline-block;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:800;color:var(--teal);font-size:13px;box-shadow:var(--shadowS)}
.hero .t b{display:block;margin-top:10px;font-size:clamp(32px,5vw,56px);line-height:1.08;color:var(--navy);font-weight:900}
.setup{display:grid;gap:14px;grid-template-columns:1fr;margin-top:14px}
@media(min-width:900px){.setup{grid-template-columns:1.1fr .9fr}}
.demoBox{background:var(--note)}
.seat{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
/* 遊戲：固定版面，不遮擋 */
.game{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:1000px){
  .game{grid-template-columns:minmax(0,1.22fr) minmax(380px,.78fr);height:calc(100dvh - 72px);align-items:stretch}
  .left{display:flex;flex-direction:column;gap:10px;min-height:0}
  .boardBox{flex:1;min-height:0;display:flex}
  .boardBox svg{width:100%;height:100%}
  .dock{display:flex;flex-direction:column;min-height:0}
  .dockBody{flex:1;overflow:auto;min-height:0}
}
.topline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px}
.round{font-weight:900;font-size:19px;color:var(--navy)}
.steps{display:flex;gap:5px;flex-wrap:wrap}
.step{padding:2px 9px;border-radius:999px;border:2px solid var(--line);font-size:12.5px;font-weight:800;background:var(--panel);color:var(--sub)}
.step.on{background:var(--navy);color:#fff}
.boardBox{padding:0;overflow:hidden}
.boardBox svg{display:block}
.pawn{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.players{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.players{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pl{padding:8px 10px;position:relative}
.pl.act{outline:4px solid var(--c);outline-offset:2px}
.pl .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.pl .nm{font-weight:900}
.meter{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:5px;margin:3px 0}
.meter b{font-size:12.5px}
.cells{display:grid;grid-template-columns:repeat(13,1fr);gap:2px}
.cell{height:18px;border-radius:4px;display:grid;place-items:center;font-size:10px;color:var(--sub);background:var(--safe);font-weight:700}
.cell.lo{background:var(--low)} .cell.hi{background:var(--high)}
.cell.cur{color:#fff;font-size:12px;font-weight:900;background:var(--c);outline:2px solid var(--line);z-index:1}
.cell.cur.dk{color:#1F2A44}
.cell.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.delta{position:absolute;right:10px;top:8px;font-weight:900;font-size:13px;animation:rise 1.6s ease forwards}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center}
.pc{font-size:11.5px;font-weight:900;padding:0 7px;border-radius:7px;border:2px solid var(--line);background:var(--c);color:#fff;line-height:18px}
.pc.off{background:var(--panel);color:var(--sub);text-decoration:line-through}
.pc.none{background:transparent;color:var(--sub);border-style:dashed;opacity:.5}
/* 行動面板 */
.dock{padding:0;overflow:hidden}
.dockHead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:2.5px solid var(--line);background:var(--soft)}
.dockHead b{font-size:15px}
.dockBody{padding:12px;display:flex;flex-direction:column;gap:10px}
.demoBar{background:var(--note);border:2px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px}
.demoBar b{color:var(--navy)}
.tip{background:var(--note);border:2.5px solid var(--line);border-radius:12px;padding:9px 11px;box-shadow:var(--shadowS);position:relative;transform:rotate(-.6deg)}
.tip .x{position:absolute;right:6px;top:4px;border:0;background:none;font-size:16px;font-weight:900}
.tip .q{font-weight:900;color:var(--navy);font-size:15.5px;margin-top:2px}
.prompt h2{font-size:18px}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{display:block;width:100%;text-align:left;border:2.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 11px;box-shadow:var(--shadowS);position:relative;transition:transform .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt.sel{background:var(--safe)}
.opt.go{background:var(--yel);color:#1F2A44;text-align:center}
.opt.ghost{text-align:center;box-shadow:none;border-style:dashed}
.opt b{display:block} .opt small{color:var(--sub);display:block}
.opt .tag{float:right}
.opt.hint{outline:4px solid var(--red);outline-offset:2px}
.opt.hint::after{content:"👉 建議";position:absolute;right:-8px;top:-12px;background:var(--red);color:#fff;font-size:11.5px;font-weight:900;padding:1px 7px;border-radius:999px;border:2px solid var(--line)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.acol h3{text-align:center;border:2px solid var(--line);border-radius:10px;padding:2px;margin-bottom:6px;font-size:14px}
.acol .opt{padding:6px 5px;text-align:center}
.dots{letter-spacing:1px;font-size:11px}
.pv{font-size:11.5px;color:var(--sub)} .pv .bad{color:var(--red);font-weight:900}
.evcard{border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadowS)}
.evcard .band{background:var(--c);color:#fff;padding:5px 10px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:800}
.evcard .bd{padding:8px 11px}
.evcard .ttl{font-size:21px;font-weight:900;color:var(--ink)}
.fx{background:var(--soft);border-radius:10px;padding:6px 9px;margin:6px 0;font-weight:800;font-size:14px}
.badge{display:inline-block;font-size:11.5px;font-weight:900;padding:0 8px;border-radius:999px;margin-right:4px;border:2px solid var(--line);line-height:19px}
.badge.bad{background:var(--red);color:#fff} .badge.stall{background:#7B2D26;color:#fff} .badge.ok{background:var(--teal);color:#fff}
.res{padding:8px 10px;border-radius:12px;background:var(--safe);border:2px solid var(--line);font-size:14px}
.arrow{display:flex;gap:10px;flex-wrap:wrap;font-weight:900}
.lesson{padding:6px 9px;border-radius:10px;background:var(--note);font-size:13.5px;border:2px solid var(--line)}
.up{color:var(--greenT);font-weight:900} .dn{color:var(--red);font-weight:900}
.feed{display:flex;flex-direction:column;gap:6px}
.feedItem{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;background:var(--panel);animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.feedItem .bar{width:6px;align-self:stretch;border-radius:4px;background:var(--c)}
.mile{background:var(--note);border:2.5px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);text-align:center}
.mile .big{font-size:20px;font-weight:900;color:var(--navy)}
details.logbox{border-top:2.5px solid var(--line);padding:6px 12px;background:var(--soft)}
details.logbox summary{cursor:pointer;font-weight:900;font-size:13.5px}
.log{max-height:150px;overflow:auto;font-size:12.5px;margin-top:4px}
.log div{padding:2px 0;border-bottom:1px dashed var(--gridline)}
.log .k-ev{color:var(--navy);font-weight:700} .log .k-bad{color:var(--red)} .log .k-good{color:var(--greenT)}
.facPanel{border:2px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
/* 規則抽屜（使用者主動開啟才出現，不擋遊戲流程） */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:3px solid var(--line);z-index:60;transform:translateX(105%);transition:transform .25s;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));box-shadow:-6px 0 0 rgba(31,42,68,.15)}
.drawer.show{transform:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:2px solid var(--gridline);padding:6px;text-align:center}
.tbl th{color:var(--sub)} .tbl td:first-child,.tbl th:first-child{text-align:left}
.win{background:var(--note)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{padding:7px;border:2px solid var(--line);border-radius:12px;text-align:center;background:var(--panel);box-shadow:var(--shadowS)}
.stat b{display:block;font-size:22px;color:var(--navy)} .stat span{font-size:12px;color:var(--sub)}
.qbox{border:2.5px solid var(--line);padding:8px 11px;margin:7px 0;background:var(--note);border-radius:12px;font-weight:700;box-shadow:var(--shadowS)}
.review{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:1000px){.review{grid-template-columns:1fr 1fr}}
footer{color:var(--sub);font-size:11.5px;text-align:center;padding:10px 12px 18px}
.hidden{display:none!important}
@media(max-width:999px){.dock{scroll-margin-top:70px}}
@media print{header.top,.drawer,#noprint{display:none!important}body{background:#fff}body::after{display:none}.card{box-shadow:none}}
</style>
</head>

/* 百歲人生：平衡之路 v2.1 遊戲引擎（與企劃書附錄A規則一致；可在瀏覽器與 Node 執行） */
const RULES = { safeLo: 2, safeHi: 9, resetLo: 3, resetHi: 9, renewAges: [45, 65, 80], renewCost: 1, maxRounds: 24, spillH: 7, centen: ['L', 'R'], circleCode: 'L', circleH: 1, annuity: 1 };
const AXES = ['h', 'f', 'm'];
const clamp = (x) => Math.max(0, Math.min(12, x));
const stageOf = (age) => (age < 45 ? 0 : age < 65 ? 1 : age < 80 ? 2 : 3);

function U(h, f, m, w) { // 電腦玩家的主觀價值
  const g = (x, wt) => { let v; if (x < 2) v = -9 + 2 * x; else if (x <= 3) v = x - 1; else if (x <= 8) v = x; else if (x === 9) v = 8.2; else v = -4 - (x - 10) * 2; return v * wt; };

function priceInfo(code, p) {

  if (p.h >= RULES.spillH) { const np = Math.max(1, price - 1); discount = price - np; price = np; }

function testCond(t, p) {

    case 'home23': return !!(p.last && p.last.place === '家' && p.last.lv >= 2);
    case 'out3': return !!(p.last && p.last.place === '戶外' && p.last.lv === 3);
    case 'M>=6': return p.m >= 6; case 'M<=5': return p.m <= 5; case 'F<=3': return p.f <= 3; case 'F<=4': return p.f <= 4; case 'F>=8': return p.f >= 8;

  return { idx: i, name: c.name, role: c.role, human: !!c.human, policy: POLICIES[c.policy || 'smart'], h: r.start.h, f: r.start.f, m: r.start.m, age: 25, stalled: false,
    prot: {}, stalls: 0, fails: 0, acts: [], paid: 0, claims: 0, claimTotal: 0, stallsCanceled: 0, renewedAt: {}, arrived: null, gateFail: 0, early: {},
    last: null, goal: null, spillUsed: 0, unins: 0, history: [], places: [new Set(), new Set(), new Set(), new Set()], firstBuyAge: null, noCoverLoss: 0, log: [] };

function evalGoal(g, p) {

  const cnt = (pl, lv) => p.acts.filter((id) => { const a = DATA.ACTIONS.find((x) => x.id === id); return a.place === pl && a.lv === lv; }).length;
  const kinds = (pl) => [1, 2, 3].filter((lv) => cnt(pl, lv) > 0).length;
  const full = (ok, part) => (ok ? 3 : part ? 1 : 0);
  switch (g.id) {

    case 'G04': { const sp = Math.max(v.h, v.f, v.m) - Math.min(v.h, v.f, v.m); return full(sp <= 2, sp === 3); }
    case 'G05': return full(kinds('戶外') === 3, kinds('戶外') === 2);
    case 'G06': { const n = p.acts.filter((id) => id === 'h3').length; return full(n >= 2, n === 1); }

const baseScore = (p) => p.h + p.f + p.m + 2 * Math.min(p.h, p.f, p.m) + 2 * Math.min(5, activeCodes(p).length);
function finalScore(p) { const g = p.goal ? evalGoal(DATA.GOALS.find((x) => x.id === p.goal), p) : 0; return { base: baseScore(p), goal: g, total: baseScore(p) + g }; }

/* ui 介面：所有 ask* 皆為 async；notify 為通知（可為 async 以便等待玩家確認） */
async function runGame(cfg, ui) {

  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const decks = {}; const draw = (key, pool) => { if (!decks[key] || !decks[key].length) decks[key] = shuffle(pool); return decks[key].pop(); };
  const P = cfg.players.map(newPlayer);
  const G = { P, round: 0, first: cfg.first ?? Math.floor(rnd() * P.length), over: false, winners: [], rules: RULES, stats: { events: 0, noCover: 0 }, script: cfg.script ? { ...cfg.script, used: {} } : null };
  ui.G = G;

  const goals = shuffle(DATA.GOALS);
  for (const p of P) { let two = [goals.pop(), goals.pop()]; if (G.script && p.idx === G.script.player && G.script.goals) two = G.script.goals.map((id) => DATA.GOALS.find((g) => g.id === id)); p.goal = (isH(p, ui) ? await ui.askGoal(p, two) : two[Math.floor(rnd() * 2)].id); }
  await ui.notify('start', { G });
  const snapshot = () => { for (const p of P) p.history.push({ round: G.round, age: p.age, h: p.h, f: p.f, m: p.m, stalled: p.stalled }); };

        p.renewedAt[p.age] = true;
        const act = activeCodes(p); const free = act.filter((c) => p.age === 80 && RULES.centen.includes(c)); const need = act.filter((c) => !free.includes(c));
        if (free.length) await ui.notify('centen', { p, codes: free });
        if (need.length) {
          let keep;
          if (isH(p, ui)) keep = await ui.askRenew(p, need); else keep = p.policy.ins !== 'none' ? need : [];
          for (const c of need) { if (keep.includes(c) && p.m >= RULES.renewCost) { p.m -= RULES.renewCost; p.paid += RULES.renewCost; } else p.prot[c] = false; }
          await ui.notify('renewed', { p, need, kept: need.filter((c) => p.prot[c] === true) });
        }

      if (p.age >= 65 && p.prot.R === true) {
        let ax;
        if (isH(p, ui)) ax = await ui.askAnnuity(p);
        else { let b = null, bs = -1e9; for (const a of ['m', 'f']) { const v = { h: p.h, f: p.f, m: p.m }; v[a] = clamp(v[a] + 1); const sc = U(v.h, v.f, v.m, { h: 1, f: 1, m: 1 }) + rnd() * 0.1; if (sc > bs) { bs = sc; b = a; } } ax = b; }
        p[ax] = clamp(p[ax] + RULES.annuity); await ui.notify('annuity', { p, ax });
      }
      let buy = null;
      const sb = G.script && p.idx === G.script.player && G.script.buys[p.age];
      if (sb && !isH(p, ui) && p.prot[sb] !== true && p.m >= priceInfo(sb, p).price) buy = sb;
      else if (isH(p, ui)) buy = await ui.askBuy(p);
      else if (!sb && p.policy.ins !== 'none') {
        for (const code of PRIO[stageOf(p.age)]) { if (p.prot[code] === true) continue; const pi = priceInfo(code, p); if (p.m - pi.price >= p.policy.reserve) { buy = code; break; } }
      }
      if (buy) {
        const pi = priceInfo(buy, p);
        if (p.m >= pi.price && p.prot[buy] !== true) {
          p.m -= pi.price; p.paid += pi.price; p.prot[buy] = true; if (pi.discount) p.spillUsed++;
          if (p.age < 45) p.early[buy] = 1; if (p.firstBuyAge === null) p.firstBuyAge = p.age;

      const w = { h: 1, f: 1, m: 1 }; const want = PRIO[stageOf(p.age)].some((c) => p.prot[c] !== true); if (p.policy.ins !== 'none' && want) w.m = 1.35;
      let best = null, bs = -1e9;

      choices.set(p, best.id);

  await ask(`<div class="mile"><div class="big">🎬 里程碑</div><p style="margin:6px 0">${txt}</p><div class="opts"><button class="opt go" data-v="ok"><b>⏩ ${label}</b></button></div></div>`, null, 'ok');
  S.ff = target; renderGame();
}

function setupScreen() {
  S.G = null; S.logs = []; S.seen = {}; S.facLog = []; S.feed = []; S.prev = {}; S.ff = 0; S.demo = false;
  const cfg = store.get('ns100.setup', { humans: 1, names: ['玩家甲', '玩家乙', '玩家丙'], roles: ['ceo', 'civil', 'care'], ai: 'smart' }); S.cfg = cfg;
  $('#main').innerHTML = `<div class="card hero"><div class="t"><span>NS100 人生馬拉松計畫｜南山大學 保險教育桌遊 數位版 v2.2</span><b class="fun">百歲人生：<br>平衡之路</b><p class="muted" style="margin:10px 0 0">健康・幸福・金錢，一場走到 100 歲的人生預演</p></div><div class="art">${HERO}</div></div>
  <div class="setup"><div class="card pad demoBox"><h2>🎬 簡報 Demo（固定劇本）</h2><p>決賽用：你扮演<b>公司總經理</b>，對手是兩位電腦玩家。手動操作 25、30、45、80 歲四個關鍵輪，中間用「快轉」帶過；六個教學橋段一定出現，面板會標示 <b style="color:var(--red)">👉 建議</b> 選項。</p><div class="row"><button class="btn pri big" id="goDemo">▶ 開始簡報 Demo</button><label class="row"><input type="checkbox" id="fa2" ${S.facilOn ? 'checked' : ''}> 顯示講師提問</label></div></div>
  <div class="card pad"><h2>一般遊戲</h2><p class="muted">3 位玩家從 25 歲走到 100 歲，每輪 5 年；同機輪流操作，不需連網，資料只存在本機。</p>
  <div class="row"><b>真人玩家</b><div class="seg" id="segH">${[0, 1, 2, 3].map((n) => `<button data-n="${n}" class="${cfg.humans === n ? 'on' : ''}">${n === 0 ? '觀戰' : n + ' 人'}</button>`).join('')}</div></div>
  <div style="display:grid;gap:8px;margin-top:10px" id="seats"></div>
  <div class="row" style="margin-top:10px"><b>電腦策略</b><div class="seg" id="segAI"><button data-a="smart" class="${cfg.ai === 'smart' ? 'on' : ''}">聰明投保</button><button data-a="none" class="${cfg.ai === 'none' ? 'on' : ''}">不投保</button></div><label class="row"><input type="checkbox" id="fa" ${S.facilOn ? 'checked' : ''}> 引導師模式</label></div>
  <div class="row" style="margin-top:12px"><button class="btn blue big" id="go">開始一般遊戲</button><button class="btn" data-rules>規則速查</button></div></div></div>
  <p class="muted" style="margin-top:12px">教學模型，不代表任何保險商品，不構成招攬。數值為簡化後的教學設計，不是保費或給付精算。</p>`;
  const seats = () => { $('#seats').innerHTML = [0, 1, 2].map((i) => { const hum = i < cfg.humans; return `<div class="seat"><span class="dot" style="background:${SEATC[i]}">${i + 1}</span><div class="row">${hum ? `<input type="text" data-nm="${i}" value="${esc(cfg.names[i])}" maxlength="6" style="width:104px" aria-label="玩家名稱">` : `<b>電腦${'甲乙丙'[i]}</b>`}<select data-rl="${i}" aria-label="角色">${Object.entries(DATA.ROLES).map(([k, r]) => `<option value="${k}" ${cfg.roles[i] === k ? 'selected' : ''}>${r.name}（H${r.start.h}／F${r.start.f}／M${r.start.m}）</option>`).join('')}</select></div></div>`; }).join(''); };
  seats();
  $('#segH').onclick = (e) => { const b = e.target.closest('[data-n]'); if (!b) return; cfg.humans = +b.dataset.n; [...$('#segH').children].forEach((x) => x.classList.toggle('on', x === b)); seats(); };
  $('#segAI').onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b) return; cfg.ai = b.dataset.a; [...$('#segAI').children].forEach((x) => x.classList.toggle('on', x === b)); };
  $('#seats').onchange = (e) => { const t = e.target; if (t.dataset.rl !== undefined) { const i = +t.dataset.rl, nv = t.value, old = cfg.roles[i]; const j = cfg.roles.findIndex((r, k) => k !== i && r === nv); if (j >= 0) cfg.roles[j] = old; cfg.roles[i] = nv; seats(); } if (t.dataset.nm !== undefined) cfg.names[+t.dataset.nm] = t.value.trim() || '玩家'; };
  const fac = (e) => { S.facilOn = e.target.checked; store.set('ns100.facil', S.facilOn); syncFacBtn(); };
  $('#fa').onchange = fac; $('#fa2').onchange = fac;
  $('#go').onclick = () => startGame(false); $('#goDemo').onclick = () => startGame(true);
}
async function startGame(demo) {
  S.demo = demo; S.feed = []; S.prev = {}; S.logs = []; S.ff = 0; S.seen = {};
  let cfg;
  if (demo) cfg = { seed: DEMO.seed, first: DEMO.first, script: DEMO.script, players: DEMO.players.map((p) => ({ ...p })) };
  else { const c = S.cfg; store.set('ns100.setup', c); const names = [0, 1, 2].map((i) => (i < c.humans ? c.names[i] || '玩家' : '電腦' + '甲乙丙'[i])); cfg = { seed: (Date.now() & 0xffffff) + 1, players: [0, 1, 2].map((i) => ({ name: names[i], role: c.roles[i], human: i < c.humans, policy: i < c.humans ? 'smart' : c.ai })) }; }
  $('#main').innerHTML = `<div class="game"><section class="left"><div class="card topline" id="hdr"></div><div class="card boardBox" id="board">${boardBase()}</div><div class="players" id="players"></div></section>
  <aside class="card dock" id="dock"><div class="dockHead" id="who"></div><div class="dockBody"><div class="demoBar hidden" id="demoBar"></div><div class="tip hidden" id="tip"></div><div id="prompt" class="prompt"></div><div class="feed" id="feed"></div><div class="facPanel hidden" id="facPanel"></div></div><details class="logbox"><summary>遊戲紀錄</summary><div class="log" id="log"></div></details></aside></div>`;
  S.timer = { phase: 0, left: PHASES[0][1] * 60, run: false }; renderFacil();
  S.G = await runGame(cfg, ui);
}

/* ---------- 規則抽屜（主動開啟） ---------- */
function showRules() {
  const d = $('#drawer'); d.innerHTML = `<div class="row"><h2 style="margin:0">規則速查（v2.1）</h2><span class="sp"></span><button class="btn" data-close>關閉 ×</button></div>
  <div class="stats" style="margin:10px 0"><div class="stat"><b>25→100</b><span>每輪 5 年</span></div><div class="stat"><b>2–9</b><span>安全區</span></div><div class="stat"><b>1 張</b><span>每輪最多買保障</span></div></div>
  <table class="tbl"><tr><th>步驟</th><th style="text-align:left">做什麼</th></tr>
  <tr><td>① 保障</td><td style="text-align:left">45／65／80 歲續保（每張 1；長照險、年金險 80 歲免）；65 歲起年金：金錢或幸福＋1；最多買 1 張（健康≥7 外溢折抵 1；健康≤3 醫療險／壽險重傷險加費 1）</td></tr>

  <tr><td>④ 事件</td><td style="text-align:left">可理賠且有有效保障時，可啟動 1 張。壽險重傷險、長照險可取消停滯但為一次性；長照險理賠時健康＋1。失衡事件後仍在區外：回到 3 或 9</td></tr>
  <tr><td>⑤ 成長</td><td style="text-align:left">沒停滯就前進 5 歲（95→100 需三軸皆在 2–9）；不論是否前進，任一軸＋1</td></tr></table>
  <p class="muted" style="margin-top:8px"><b>計分：</b>三軸合計＋2×最低軸＋2×有效保障（最多 5 張）＋人生目標（3／1／0）。同輪抵達比品質分，再比最低軸。</p>`;

document.addEventListener('click', (e) => { if (e.target.closest('[data-rules]')) showRules(); if (e.target.closest('[data-close]')) $('#drawer').classList.remove('show'); });

/* ---------- 復盤 ---------- */
function questions(p) {
  const q = []; const act = activeCodes(p); const goal = DATA.GOALS.find((g) => g.id === p.goal);
  if (p.unins >= 2) q.push([9, `你遇到了 ${p.unins} 次「不可保」的事件。如果發生在現實裡，你原本是怎麼準備的？誰會是你的第一道支持？`]);
  if (p.fails >= 2) q.push([8, `你被迫面對 ${p.fails} 次失衡事件。哪一條軸最常被你犧牲？現實中，是誰在替你補這個缺口？`]);
  if (p.stallsCanceled >= 1) q.push([8, `你用定額給付型保障取消過 ${p.stallsCanceled} 次停滯。你買到的是錢還是時間？現實中，你最缺的是哪一個？`]);
  if (p.stalls >= 3) q.push([7, `你停滯了 ${p.stalls} 次。當時間被卡住時，你最希望身邊有誰、有什麼資源？`]);
  if (Object.keys(p.prot).length === 0) q.push([9, '整局你都沒有保障。沒有保障時，你的第一道防線是現金、家人，還是健康？']);
  if (p.firstBuyAge !== null && p.firstBuyAge >= 45) q.push([7, `你到 ${p.firstBuyAge} 歲才第一次投保。如果提早二十年開始準備，你的選擇會有什麼不同？`]);
  if (p.paid >= 10) q.push([6, `你一共付出 ${p.paid} 點保費。多少保障才不會壓垮你的現金流？`]);
  if (!act.includes('L') && !act.includes('R')) q.push([6, '活到 100 歲，誰來照顧你？你的現金流夠不夠撐到那一天？']);
  if (p.spillUsed >= 1) q.push([5, `你有 ${p.spillUsed} 次因為健康好而少付保費。在現實裡，「健康」可以為你換到什麼？`]);
  if (goal) q.push([4, `你的人生目標是「${goal.name}」。${goal.ask}`]);
  q.push([2, '哪一個選擇你明知道不好還是選了？當時你在換什麼？'], [2, '哪一次事件最讓你意外？它是可保的，還是不可保的？'], [1, '遊戲中的三軸，哪一軸在現實裡最容易被你忽略？']);
  return q.sort((a, b) => b[0] - a[0]).slice(0, 3).map((x) => x[1]);
}
function chart(p) {
  const H = p.history, W = 640, Ht = 230, L = 34, B = 24, n = Math.max(1, H.length - 1); const x = (i) => L + (W - L - 8) * i / n, y = (v) => Ht - B - (Ht - B - 10) * v / 12;
  let s = `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto"><rect x="${L}" y="${y(9)}" width="${W - L - 8}" height="${y(2) - y(9)}" fill="var(--safe)"/>`;
  for (const v of [0, 2, 4, 6, 8, 10, 12]) s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text><line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--gridline)" stroke-width="1"/>`;
  [['h', '#6DB33F'], ['f', '#E0A800'], ['m', '#0064B9']].forEach(([k, c]) => { s += `<polyline fill="none" stroke="${c}" stroke-width="3.5" stroke-linejoin="round" points="${H.map((r, i) => x(i) + ',' + y(r[k])).join(' ')}"/>`; });
  H.forEach((r, i) => { if (r.stalled) s += `<circle cx="${x(i)}" cy="${Ht - B + 8}" r="4" fill="#E2483D"/>`; if (i % 2 === 0 || i === H.length - 1) s += `<text x="${x(i)}" y="${Ht - 4}" text-anchor="middle" font-size="10" fill="var(--sub)">${r.age}</text>`; });
  return s + '</svg><div class="legend"><span><i style="background:#6DB33F"></i>健康</span><span><i style="background:#E0A800"></i>幸福</span><span><i style="background:#0064B9"></i>金錢</span><span><i style="background:var(--safe)"></i>安全區</span><span>橫軸：每輪開始時的年齡</span></div>';
}
function showReview(sel) {
  const G = S.G; const P = G.P; const isCh = (p) => G.champions.includes(p);
  const rows = [...P].sort((a, b) => (isCh(b) - isCh(a)) || (!!b.arrived - !!a.arrived) || b.age - a.age || finalScore(b).total - finalScore(a).total).map((p) => { const f = finalScore(p); const g = DATA.GOALS.find((x) => x.id === p.goal); return `<tr class="${isCh(p) ? 'win' : ''}"><td>${isCh(p) ? '🏆 ' : ''}<b>${esc(p.name)}</b><br><span class="muted">${DATA.ROLES[p.role].short}</span></td><td>${p.age}${p.arrived ? '' : '<br><span class="muted">未登頂</span>'}</td><td>${p.h}／${p.f}／${p.m}</td><td>${activeCodes(p).map((c) => chip(c)).join(' ') || '—'}</td><td>${f.base}</td><td>${f.goal}<br><span class="muted">${g.name}</span></td><td><b style="font-size:18px">${f.total}</b></td></tr>`; }).join('');
  const me = sel !== undefined ? P[sel] : (humans()[0] || P[0]); const idx = P.indexOf(me); const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const win = G.champions.map((p) => esc(p.name)).join('、');
  $('#main').innerHTML = `<div class="review"><div class="card pad"><h2 class="fun" style="font-size:26px">🏔 ${G.winners.length ? win + (G.champions.length > 1 ? ' 共同登頂獲勝' : ' 登頂獲勝！') : '無人登頂'}</h2><p class="muted">第 ${G.round} 輪結束。${G.tie ? '多位玩家同輪抵達，依品質分、再依最低軸決勝。' : ''}</p><table class="tbl"><tr><th>玩家</th><th>年齡</th><th>H／F／M</th><th>有效保障</th><th>基本分</th><th>目標</th><th>總分</th></tr>${rows}</table><p class="muted">勝負只比較「登上 100 歲」的玩家；未登頂者的分數僅供復盤。基本分＝三軸合計＋2×最低軸＋2×有效保障（最多 5 張）。</p>
  <h3 style="margin-top:12px">這局 ${esc(me.name)} 的數字</h3><div class="stats">${st(me.claimTotal, '理賠減免')}${st(me.paid, '保費與續保')}${st(me.unins, '不可保損失')}${st(me.stalls, '停滯')}${st(me.stallsCanceled, '取消停滯')}${st(me.fails, '失衡事件')}${st(me.spillUsed, '外溢折抵')}${st(me.firstBuyAge === null ? '—' : me.firstBuyAge, '首次投保年齡')}</div></div>
  <div class="card pad"><div class="row"><h2 style="margin:0">復盤報告</h2><div class="seg" id="segP">${P.map((p, i) => `<button data-i="${i}" class="${i === idx ? 'on' : ''}">${esc(p.name)}</button>`).join('')}</div></div>
  <h3 style="margin-top:10px">三軸走勢</h3>${chart(me)}
  <h3 style="margin-top:10px">我的三個提問</h3>${questions(me).map((t, i) => `<div class="qbox">${i + 1}. ${esc(t)}</div>`).join('')}
  <h3 style="margin-top:10px">回到現實，我會做的一件小事</h3><textarea id="pledge" placeholder="例如：這週和家人聊一次「如果需要被照顧，我們怎麼分工」。"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="copy">複製提問與承諾</button><span class="muted" id="cmsg"></span></div></div></div>
  <div class="row" style="margin-top:14px" id="noprint"><button class="btn pri big" id="again">${S.demo ? '重播 Demo' : '再玩一局'}</button><button class="btn" id="back">回到首頁</button></div>`;
  $('#segP').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) showReview(+b.dataset.i); };
  const ta = $('#pledge'); ta.value = store.get('ns100.pledge.' + idx, ''); ta.oninput = () => store.set('ns100.pledge.' + idx, ta.value);
  $('#copy').onclick = async () => { const text = `【我的三個提問｜百歲人生：平衡之路】\n${questions(me).map((t, i) => (i + 1) + '. ' + t).join('\n')}\n\n【我會做的一件小事】\n${ta.value || '（尚未填寫）'}`; try { await navigator.clipboard.writeText(text); $('#cmsg').textContent = '已複製'; } catch (e) { ta.select(); $('#cmsg').textContent = '請手動複製'; } };
  $('#again').onclick = () => { const d = S.demo; setupScreen(); startGame(d); }; $('#back').onclick = setupScreen;
  window.scrollTo(0, 0);
}

/* ---------- 啟動 ---------- */
function syncFacBtn() { const b = $('#btnFac'); b.classList.toggle('on', S.facilOn); b.textContent = S.facilOn ? '講師提問：開' : '講師提問：關'; renderFacil(); }
$('#btnFac').onclick = () => { S.facilOn = !S.facilOn; store.set('ns100.facil', S.facilOn); syncFacBtn(); ['#fa', '#fa2'].forEach((k) => { const f = $(k); if (f) f.checked = S.facilOn; }); };
$('#btnTheme').onclick = () => { const r = document.documentElement; const dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', dark ? 'light' : 'dark'); store.set('ns100.theme', dark ? 'light' : 'dark'); };
$('#btnHome').onclick = () => { if (S.G && !S.G.over) { const d = $('#drawer'); d.innerHTML = `<h2>回到首頁？</h2><p class="muted">目前這局的進度不會保留。</p><div class="row"><button class="btn pri" id="yesHome">回到首頁</button><button class="btn" data-close>繼續遊戲</button></div>`; d.classList.add('show'); $('#yesHome').onclick = () => location.reload(); return; } setupScreen(); };
{ const t = store.get('ns100.theme', null); if (t) document.documentElement.setAttribute('data-theme', t); }
syncFacBtn(); setupScreen();
window.__app = { S, ui, startGame, setupScreen, DEMO };

</script>
