<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>百歲人生：平衡之路｜數位版 v2.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>:root{--bg:#F7F5EF;--panel:#FFFFFF;--ink:#1F2937;--sub:#6B7280;--line:#D9DDE3;--navy:#1F3A5F;--green:#2E8B57;--orange:#E07A1F;--blue:#1F6FB2;--gold:#B8860B;--red:#C0392B;--mist:#EAF3EE;--safe:#E3F0E8;--low:#F6D4D0;--high:#FBE0C2;--shadow:0 6px 24px rgba(31,58,95,.12);--r:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161D;--panel:#18212B;--ink:#E8EDF2;--sub:#9AA7B5;--line:#2C3948;--navy:#9CC2F0;--green:#5CC28A;--orange:#F2A04F;--blue:#6BB1EE;--gold:#E3B94A;--red:#EE7B6E;--mist:#1B2B25;--safe:#1D3328;--low:#4A2724;--high:#4A361F;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#10161D;--panel:#18212B;--ink:#E8EDF2;--sub:#9AA7B5;--line:#2C3948;--navy:#9CC2F0;--green:#5CC28A;--orange:#F2A04F;--blue:#6BB1EE;--gold:#E3B94A;--red:#EE7B6E;--mist:#1B2B25;--safe:#1D3328;--low:#4A2724;--high:#4A361F;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--navy);font-size:18px;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--sub);font-size:12px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);color:var(--bg);border-color:var(--navy)}
:root[data-theme="dark"] .btn.pri,@media (prefers-color-scheme:dark){.btn.pri{color:#10161D}}
.btn.on{background:var(--green);color:#fff;border-color:var(--green)}
.btn.big{padding:12px 22px;font-size:17px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px}
h2{margin:0 0 8px;font-size:20px;color:var(--navy)} h3{margin:0 0 6px;font-size:16px;color:var(--navy)}
.muted{color:var(--sub);font-size:14px}
.grid{display:grid;gap:12px}
.hero{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);position:relative;background:linear-gradient(180deg,#CDE5DE,#FBF4E1)}
.hero svg{display:block;width:100%;height:auto}
.hero .t{position:absolute;left:18px;top:14px;right:18px}
.hero .t b{display:block;font-size:clamp(26px,6vw,46px);color:#1F3A5F;line-height:1.1}
.hero .t span{color:#2E6F5E;font-weight:700;font-size:clamp(12px,2.6vw,16px)}
.seat{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.dot{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:84px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:600}
.seg button.on{background:var(--navy);color:var(--bg)}
/* 遊戲畫面 */
.layout{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.layout{grid-template-columns:1.25fr 1fr}}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--sub)}
.step.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.board svg{width:100%;height:auto;display:block;border-radius:var(--r)}
.pl{padding:10px 12px;border-left:6px solid var(--c)}
.pl.act{outline:3px solid var(--c);outline-offset:-1px}
.pl .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl .nm{font-weight:800}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.tag.red{color:var(--red);border-color:var(--red)} .tag.gold{color:var(--gold);border-color:var(--gold)}
.meter{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;margin:5px 0}
.meter b{font-size:13px}
.cells{display:grid;grid-template-columns:repeat(13,1fr);gap:2px}
.cell{height:22px;border-radius:4px;display:grid;place-items:center;font-size:11px;color:var(--sub);background:var(--safe)}
.cell.lo{background:var(--low)} .cell.hi{background:var(--high)}
.cell.cur{color:#fff;font-weight:800;font-size:13px;background:var(--c);box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--c)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.pc{font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px;border:2px solid var(--c);color:var(--c)}
.pc.on{background:var(--c);color:#fff} .pc.off{text-decoration:line-through;opacity:.55} .pc.none{opacity:.28;border-style:dashed}
.log{max-height:240px;overflow:auto;font-size:14px}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
.log .k-ev{color:var(--navy)} .log .k-bad{color:var(--red)} .log .k-good{color:var(--green)}
/* 面板 / 浮層 */
.overlay{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.overlay.show{display:flex}
@media(min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px;box-shadow:var(--shadow)}
@media(min-width:700px){.sheet{border-radius:20px}}
.sheet h2{margin-bottom:4px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt.sel{border-color:var(--green);background:var(--mist)}
.opt b{display:block} .opt small{color:var(--sub)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acol h3{text-align:center;color:#fff;border-radius:10px;padding:4px;margin-bottom:6px}
.acol .opt{padding:8px;text-align:center}
.dots{letter-spacing:2px;font-size:12px}
.pv{font-size:12px;color:var(--sub)} .pv .bad{color:var(--red);font-weight:800}
.evcard{border:1px solid var(--line);border-top:10px solid var(--c);border-radius:14px;padding:10px 12px;background:var(--panel)}
.evcard .hd{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;font-weight:700}
.evcard .ttl{font-size:22px;font-weight:800;color:var(--c);margin:2px 0}
.fx{background:var(--mist);border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:700}
.fx div{margin:2px 0}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;margin-right:4px}
.badge.bad{background:var(--red);color:#fff} .badge.stall{background:#7B2D26;color:#fff} .badge.ok{background:var(--blue);color:#fff}
.res{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--mist)}
.arrow{display:flex;gap:10px;flex-wrap:wrap;font-weight:800}
.lesson{margin-top:8px;padding:8px 10px;border-left:4px solid var(--gold);background:var(--panel);font-size:14px}
.up{color:var(--green)} .dn{color:var(--red)}
.fac{border:2px solid var(--gold);border-radius:var(--r);padding:12px;background:var(--panel)}
.fac .q{font-size:18px;font-weight:700;color:var(--navy)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center}
.tbl th{color:var(--sub);font-weight:700}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.win{background:var(--mist)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{padding:8px;border:1px solid var(--line);border-radius:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--navy)} .stat span{font-size:12px;color:var(--sub)}
.qbox{border-left:5px solid var(--green);padding:8px 12px;margin:8px 0;background:var(--mist);border-radius:0 12px 12px 0;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:var(--navy);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:60;font-weight:700;box-shadow:var(--shadow);max-width:92%;display:none}
.toast.show{display:block}
footer{color:var(--sub);font-size:12px;text-align:center;padding:14px 12px 28px}
.hidden{display:none!important}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--sub)} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media print{header.top,.overlay,.toast,#noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}

@media(max-width:600px){.hero .t{position:static;padding:10px 14px 12px;background:var(--panel)}.hero .t b{font-size:30px}}
</style>
</head>

/* 百歲人生：平衡之路 v2.1 遊戲引擎（與企劃書附錄A規則一致；可在瀏覽器與 Node 執行） */
const RULES = { safeLo: 2, safeHi: 9, resetLo: 3, resetHi: 9, renewAges: [45, 65, 80], renewCost: 1, maxRounds: 24, spillH: 7, centen: ['L', 'R'], circleCode: 'L', circleH: 1, annuity: 1 };
const AXES = ['h', 'f', 'm'];
const clamp = (x) => Math.max(0, Math.min(12, x));
const stageOf = (age) => (age < 45 ? 0 : age < 65 ? 1 : age < 80 ? 2 : 3);
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function U(h, f, m, w) { // 電腦玩家的主觀價值
  const g = (x, wt) => { let v; if (x < 2) v = -9 + 2 * x; else if (x <= 3) v = x - 1; else if (x <= 8) v = x; else if (x === 9) v = 8.2; else v = -4 - (x - 10) * 2; return v * wt; };

const POLICIES = { smart: { ins: 'smart', reserve: 2 }, none: { ins: 'none', reserve: 0 } };

function priceInfo(code, p) {

  const surcharge = ((code === 'M' || code === 'C') && p.h <= 3) ? 1 : 0;
  let price = base + surcharge; let discount = 0;
  if (p.h >= RULES.spillH) { const np = Math.max(1, price - 1); discount = price - np; price = np; }
  return { base, surcharge, discount, price };
}
function testCond(t, p) {
  switch (t) {
    case 'work23': return !!(p.last && p.last.place === '公司' && p.last.lv >= 2);
    case 'home23': return !!(p.last && p.last.place === '家' && p.last.lv >= 2);
    case 'out3': return !!(p.last && p.last.place === '戶外' && p.last.lv === 3);
    case 'M>=6': return p.m >= 6; case 'M<=5': return p.m <= 5; case 'F<=3': return p.f <= 3; case 'F<=4': return p.f <= 4; case 'F>=8': return p.f >= 8;
  }

function activeCodes(p) { return Object.keys(p.prot).filter((c) => p.prot[c] === true); }
function newPlayer(c, i) {
  const r = DATA.ROLES[c.role];
  return { idx: i, name: c.name, role: c.role, human: !!c.human, policy: POLICIES[c.policy || 'smart'], h: r.start.h, f: r.start.f, m: r.start.m, age: 25, stalled: false,
    prot: {}, stalls: 0, fails: 0, acts: [], paid: 0, claims: 0, claimTotal: 0, stallsCanceled: 0, renewedAt: {}, arrived: null, gateFail: 0, early: {},
    last: null, goal: null, spillUsed: 0, unins: 0, history: [], places: [new Set(), new Set(), new Set(), new Set()], firstBuyAge: null, noCoverLoss: 0, log: [] };
}
function evalGoal(g, p) {
  const v = { h: p.h, f: p.f, m: p.m }; const act = activeCodes(p);
  const cnt = (pl, lv) => p.acts.filter((id) => { const a = DATA.ACTIONS.find((x) => x.id === id); return a.place === pl && a.lv === lv; }).length;
  const kinds = (pl) => [1, 2, 3].filter((lv) => cnt(pl, lv) > 0).length;
  const full = (ok, part) => (ok ? 3 : part ? 1 : 0);
  switch (g.id) {

    case 'G04': { const sp = Math.max(v.h, v.f, v.m) - Math.min(v.h, v.f, v.m); return full(sp <= 2, sp === 3); }
    case 'G05': return full(kinds('戶外') === 3, kinds('戶外') === 2);
    case 'G06': { const n = p.acts.filter((id) => id === 'h3').length; return full(n >= 2, n === 1); }

function finalScore(p) { const g = p.goal ? evalGoal(DATA.GOALS.find((x) => x.id === p.goal), p) : 0; return { base: baseScore(p), goal: g, total: baseScore(p) + g }; }

/* ui 介面：所有 ask* 皆為 async；notify 為通知（可為 async 以便等待玩家確認） */
async function runGame(cfg, ui) {
  const rnd = rng(cfg.seed || 1);
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const decks = {}; const draw = (key, pool) => { if (!decks[key] || !decks[key].length) decks[key] = shuffle(pool); return decks[key].pop(); };
  const P = cfg.players.map(newPlayer);
  const G = { P, round: 0, first: Math.floor(rnd() * P.length), over: false, winners: [], rules: RULES, stats: { events: 0, noCover: 0 } };
  ui.G = G;
  // 人生目標：每人抽2張留1張
  const goals = shuffle(DATA.GOALS);
  for (const p of P) { const two = [goals.pop(), goals.pop()]; p.goal = (p.human ? await ui.askGoal(p, two) : two[Math.floor(rnd() * 2)].id); }
  await ui.notify('start', { G });
  const snapshot = () => { for (const p of P) p.history.push({ round: G.round, age: p.age, h: p.h, f: p.f, m: p.m, stalled: p.stalled }); };
  snapshot();
  while (G.round < RULES.maxRounds) {
    G.round++;
    const order = [0, 1, 2].map((i) => P[(G.first + i) % 3]);
    G.order = order; await ui.notify('roundStart', { G, order });
    // ① 保障階段

      if (RULES.renewAges.includes(p.age) && !p.renewedAt[p.age]) {
        p.renewedAt[p.age] = true;
        const act = activeCodes(p); const free = act.filter((c) => p.age === 80 && RULES.centen.includes(c)); const need = act.filter((c) => !free.includes(c));
        if (free.length) await ui.notify('centen', { p, codes: free });
        if (need.length) {
          let keep;
          if (p.human) keep = await ui.askRenew(p, need); else keep = p.policy.ins !== 'none' ? need : [];
          for (const c of need) { if (keep.includes(c) && p.m >= RULES.renewCost) { p.m -= RULES.renewCost; p.paid += RULES.renewCost; } else p.prot[c] = false; }
          await ui.notify('renewed', { p, need, kept: need.filter((c) => p.prot[c] === true) });
        }
      }
      if (p.age >= 65 && p.prot.R === true) {
        let ax;
        if (p.human) ax = await ui.askAnnuity(p);
        else { let b = null, bs = -1e9; for (const a of ['m', 'f']) { const v = { h: p.h, f: p.f, m: p.m }; v[a] = clamp(v[a] + 1); const sc = U(v.h, v.f, v.m, { h: 1, f: 1, m: 1 }) + rnd() * 0.1; if (sc > bs) { bs = sc; b = a; } } ax = b; }
        p[ax] = clamp(p[ax] + RULES.annuity); await ui.notify('annuity', { p, ax });
      }
      let buy = null;
      if (p.human) buy = await ui.askBuy(p);
      else if (p.policy.ins !== 'none') {
        for (const code of PRIO[stageOf(p.age)]) { if (p.prot[code] === true) continue; const pi = priceInfo(code, p); if (p.m - pi.price >= p.policy.reserve) { buy = code; break; } }
      }
      if (buy) {
        const pi = priceInfo(buy, p);
        if (p.m >= pi.price && p.prot[buy] !== true) {
          p.m -= pi.price; p.paid += pi.price; p.prot[buy] = true; if (pi.discount) p.spillUsed++;
          if (p.age < 45) p.early[buy] = 1; if (p.firstBuyAge === null) p.firstBuyAge = p.age;
          await ui.notify('bought', { p, code: buy, pi });
        }
      }
    }
    // ② 行動（同時選擇、同時亮牌）
    const choices = new Map();
    for (const p of order) {
      if (p.arrived) continue;
      if (p.human) { choices.set(p, await ui.askAction(p)); continue; }
      const w = { h: 1, f: 1, m: 1 }; const want = PRIO[stageOf(p.age)].some((c) => p.prot[c] !== true); if (p.policy.ins !== 'none' && want) w.m = 1.35;
      let best = null, bs = -1e9;
      for (const a of DATA.ACTIONS) { const s = U(clamp(p.h + (a.d.h || 0)), clamp(p.f + (a.d.f || 0)), clamp(p.m + (a.d.m || 0)), w) + rnd() * 0.3; if (s > bs) { bs = s; best = a; } }

      let worst = null, wd = 0;

  $('#hdr').innerHTML = `<div class="row" style="justify-content:space-between"><div><b style="font-size:18px">第 ${G.round} 輪</b> <span class="muted">每輪＝5年｜先手：${esc(G.P[G.first % 3].name)}</span></div><div class="steps">${STEPS.map((t, i) => `<span class="step ${S.step === i ? 'on' : ''}">${t}</span>`).join('')}</div></div>`;
  $('#board').innerHTML = boardSVG();
  $('#players').innerHTML = G.P.map(playerCard).join('');
  $('#log').innerHTML = (S.logs || []).join('');
  renderFacil();
}

  async askBuy(p) {

      return `<button class="opt" data-v="${c}" ${own || poor ? 'disabled' : ''}><b>${chip(c)} ${pc.name}　價格 ${pi.price}${own ? '（已持有）' : p.prot[c] === false ? '（已失效，可重新投保）' : ''}</b><small>${pc.kind}｜限額 ${pc.limit}${pc.time ? '｜可取消停滯' : ''}${pc.once ? '｜一次性' : ''}${pc.centen ? '｜80歲免續保' : ''}${pc.circle ? '｜守護圈：理賠健康＋1' : ''}<br>保：${pc.cover}｜不保：${pc.no}</small>${tags}</button>`; }).join('');
    const v = await ask(`<h2>${who(p)}：保障階段（${age} 歲）</h2><p class="muted">金錢 ${p.m}。每輪最多買 1 張；健康≥7 購買折抵 1、健康≤3 醫療險／壽險重傷險加費 1。</p><div class="opts">${rows}<button class="opt" data-v="skip" style="text-align:center"><b>這輪不買</b></button></div>`);
    return v === 'skip' ? null : v;
  },
  async askAction(p) {
    S.active = p; S.step = 1; renderGame(); await handoff(p, '請秘密選一張行動卡，其他玩家先別看。');
    const col = { 戶外: 'var(--green)', 家: 'var(--orange)', 公司: 'var(--blue)' };
    const cols = ['戶外', '家', '公司'].map((pl) => `<div class="acol"><h3 style="background:${col[pl]}">${pl}</h3>${DATA.ACTIONS.filter((a) => a.place === pl).map((a) => { const n = { h: clampV(p.h + (a.d.h || 0)), f: clampV(p.f + (a.d.f || 0)), m: clampV(p.m + (a.d.m || 0)) }; const bad = ['h', 'f', 'm'].some((k) => n[k] < 2 || n[k] > 9); return `<button class="opt" data-v="${a.id}"><b>${a.name}</b><span class="dots">${'●'.repeat(a.lv)}${'○'.repeat(3 - a.lv)}</span><div style="font-size:13px">${fxLine(a.d)}</div><div class="pv">→ ${['h', 'f', 'm'].map((k) => `<span class="${n[k] < 2 || n[k] > 9 ? 'bad' : ''}">${n[k]}</span>`).join('／')}${bad ? ' ⚠' : ''}</div></button>`; }).join('')}</div>`).join('');
    return ask(`<h2>${who(p)}：選擇本輪行動（${p.age} 歲）</h2><p class="muted">目前 H${p.h}／F${p.f}／M${p.m}。結算後若任一軸 &lt;2 或 ≥10（⚠），會抽失衡事件。</p><div class="acts">${cols}</div>`);
  },
  async askOption(p, ev, okArr) {
    S.active = p; renderGame();
    return +(await ask(`<h2>${who(p)}：面對事件</h2>${evCard(ev, null)}<div class="opts">${ev.opts.map((o, i) => `<button class="opt" data-v="${i}" ${okArr[i] ? '' : 'disabled'}><b>${'①②③'[i]} ${esc(o.t)}</b>${okArr[i] ? '' : '<small>金錢不足，無法選擇</small>'}</button>`).join('')}</div>`));

  async askClaim(p, ev, elig, info) {

    const v = await ask(`<h2>${who(p)}：要啟動保障嗎？</h2>${evCard(ev, null)}<p class="muted">金錢損失 ${info.loss}${info.stall ? '，且本事件會讓你停滯' : ''}。每個事件最多啟動 1 張。</p><div class="opts">${elig.map((c) => { const pc = DATA.PROT[c]; return `<button class="opt" data-v="${c}"><b>${chip(c)} 使用${pc.name}</b><small>減免金錢損失 ${Math.min(pc.limit, info.loss)}${pc.time && info.stall ? '；取消停滯' : ''}${c === RULES.circleCode ? '；守護圈服務：健康＋1' : ''}${pc.once ? '；一次性給付' : ''}</small></button>`; }).join('')}<button class="opt" data-v="none" style="text-align:center"><b>不使用</b></button></div>`);
    return v === 'none' ? null : v;
  },
  async askLapse(p, act) { return ask(`<h2>${who(p)}：保單停效</h2><p class="muted">繳不出保費時，保障會先被犧牲。請選一張翻面失效。</p><div class="opts">${act.map((c) => `<button class="opt" data-v="${c}"><b>${chip(c)} ${DATA.PROT[c].name}</b></button>`).join('')}</div>`); },
  async askBonus(p) {
    S.active = p; S.step = 4; renderGame();
    return ask(`<h2>${who(p)}：成長加值</h2><p class="muted">每輪都能把任一軸 +1（上限 12）。注意：≥10 會進入過載區。</p><div class="opts">${['h', 'f', 'm'].map((k) => `<button class="opt" data-v="${k}" ${p[k] >= 12 ? 'disabled' : ''}><b style="color:${AXC[k]}">${AXN[k]} ＋1</b><small>${p[k]} → ${Math.min(12, p[k] + 1)}${p[k] + 1 >= 10 ? '（進入過載區）' : ''}</small></button>`).join('')}</div>`);
  },
  async notify(type, d) {
    const G = this.G; S.G = G; const fast = S.speed === 'fast' || humans().length === 0;
    switch (type) {
      case 'start': renderGame(); logAdd('遊戲開始：25 歲出發，目標是通過百歲檢核登頂。', 'k-ev'); break;
      case 'roundStart': S.step = 0; S.active = null; renderGame(); logAdd(`── 第 ${G.round} 輪（${G.P.map((p) => p.age).join('／')} 歲）──`, 'k-ev'); if (G.round === 1) toast('第 1 輪：先保障、再行動'); break;
      case 'turn': S.active = d.p; S.step = 0; renderGame(); break;
      case 'centen': logAdd(`${esc(d.p.name)}：${d.codes.join('、')} 80 歲免續保（保障至 100 歲）`, 'k-good'); await facil('centen', d.p); break;
      case 'renewed': logAdd(`${esc(d.p.name)} ${d.p.age} 歲續保：留 ${d.kept.join('、') || '無'}${d.need.length - d.kept.length ? '，失效 ' + d.need.filter((c) => !d.kept.includes(c)).join('、') : ''}`); if (d.p.age === 45) await facil('renew45', d.p); break;
      case 'annuity': logAdd(`${esc(d.p.name)} 年金：${AXN[d.ax]}＋1`, 'k-good'); break;
      case 'bought': logAdd(`${esc(d.p.name)} 購買 ${d.code} ${DATA.PROT[d.code].name}（${d.pi.price}${d.pi.discount ? '，外溢折抵' : ''}${d.pi.surcharge ? '，體況加費' : ''}）`, 'k-good'); renderGame(); if (d.pi.discount) await facil('spill', d.p); await facil('firstBuy', d.p); break;
      case 'reveal': {
        S.step = 1; S.active = null; renderGame();
        d.reveal.forEach((r) => logAdd(`${esc(r.p.name)} 選了「${r.a.place}${r.a.lv} ${r.a.name}」：${fxLine(r.a.d).replace(/<[^>]+>/g, '')}`));
        await ask(`<h2>同時亮牌</h2><p class="muted">所有人的行動卡同時翻開並結算。</p><div class="opts">${d.reveal.map((r) => `<div class="opt" style="cursor:default"><b>${who(r.p)}：${r.a.place}${r.a.lv} ${r.a.name}</b><small>${fxLine(r.a.d)}　→　H${r.p.h}／F${r.p.f}／M${r.p.m}${[r.p.h, r.p.f, r.p.m].some((x) => x < 2 || x > 9) ? ' ⚠' : ''}</small></div>`).join('')}<button class="opt" data-v="ok" style="text-align:center"><b>繼續：平衡檢查與事件</b></button></div>`);
        break; }
      case 'eventDrawn': S.step = d.failing ? 2 : 3; S.active = d.p; renderGame(); if (d.failing) logAdd(`${esc(d.p.name)} ${AXN[d.failing.ax]}${d.failing.dir === 'low' ? '不足' : '過載'}，抽失衡事件`, 'k-bad'); break;
      case 'eventResolved': {
        S.step = 3; renderGame(); const { p, ev, res } = d; const loss = ['h', 'f', 'm'].some((k) => res.d[k] < 0);
        logAdd(`${esc(p.name)}｜${ev.id} ${esc(ev.title)} → ${vals(res.after)}${res.used ? '，理賠 ' + res.used : ''}${res.unins ? '，不可保' : ''}${res.stall ? '，停滯' : ''}`, res.unins || res.stall ? 'k-bad' : 'k-ev'); renderGame();
        const card = `<h2>${who(p)}：事件結果</h2>${evCard(ev, d.failing)}${res.notes.length ? `<p class="muted">${res.notes.map(esc).join('；')}</p>` : ''}${resBox(res, p)}<div class="lesson"><b>教育回饋：</b>${esc(ev.lesson)}</div>`;
        if (p.human) await ask(card + '<div class="opts"><button class="opt" data-v="ok" style="text-align:center"><b>繼續</b></button></div>');
        else if (!fast) await ask(card + '<div class="opts"><button class="opt" data-v="ok" style="text-align:center"><b>繼續</b></button></div>');
        else { toast(`${p.name}：${ev.title}`, 1100); await sleep(humans().length ? 900 : 260); }
        if (res.unins && loss) await facil('unins', p, 2); if (res.canceled) await facil('cancel', p); if (res.svc) await facil('circle', p);
        break; }
      case 'grow': {
        const { p, moved, why, ax } = d; S.step = 4; renderGame();
        logAdd(`${esc(p.name)} ${moved ? '前進到 ' + p.age + ' 歲' : why === 'stall' ? '停滯，年齡不動' : '百歲檢核未通過，留在 ' + p.age + ' 歲'}；${AXN[ax]}＋1`, why ? 'k-bad' : 'k-good'); renderGame();
        if (why === 'gate') { if (p.human) await ask(`<h2>${who(p)}：百歲檢核未通過</h2><p>要登上 100 歲，三軸必須都在安全區 2–9。這輪你留在 ${p.age} 歲，仍可獲得成長加值。</p><div class="opts"><button class="opt" data-v="ok" style="text-align:center"><b>繼續</b></button></div>`); await facil('gate', p); }
        else if (p.human) toast(moved ? `前進到 ${p.age} 歲` : '停滯：本輪不前進，但仍＋1', 1100);
        if (p.arrived) logAdd(`${esc(p.name)} 登上 100 歲！`, 'k-good');
        break; }
      case 'roundEnd': renderGame(); await sleep(humans().length ? 150 : 60); break;
      case 'gameOver': S.active = null; renderGame(); await sleep(300); showReview(); break;
    }
  },
};
const clampV = (x) => Math.max(0, Math.min(12, x));

async function startGame() {
  const cfg = S.cfg; store.set('ns100.setup', cfg);
  const names = [0, 1, 2].map((i) => (i < cfg.humans ? cfg.names[i] || '玩家' : '電腦' + '甲乙丙'[i]));
  const players = [0, 1, 2].map((i) => ({ name: names[i], role: cfg.roles[i], human: i < cfg.humans, policy: i < cfg.humans ? 'smart' : cfg.ai }));
  $('#main').innerHTML = `<div id="hdr" class="card pad"></div><div class="layout" style="margin-top:12px"><div class="grid"><div class="card board" id="board"></div><div id="facil" class="fac hidden"></div><div class="card pad"><h3>遊戲紀錄</h3><div class="log" id="log"></div></div></div><div class="grid" id="players"></div></div><div class="legend card pad" style="margin-top:12px"><span><i style="background:var(--low)"></i>0–1 不足區</span><span><i style="background:var(--safe)"></i>2–9 安全區</span><span><i style="background:var(--high)"></i>10–12 過載區</span><span>續＝續保年齡</span></div>`;
  S.timer = { phase: 0, left: PHASES[0][1] * 60, run: false }; S.logs = [];
  const G = await runGame({ seed: (Date.now() & 0xffffff) + 1, players }, ui);
  S.G = G;
}

/* ---------- 規則速查 ---------- */
function showRules() {
  ask(`<h2>規則速查（v2.1）</h2><div class="stats" style="margin-bottom:8px"><div class="stat"><b>25→100</b><span>每輪 5 年</span></div><div class="stat"><b>2–9</b><span>安全區</span></div><div class="stat"><b>0–12</b><span>軸線範圍</span></div></div>
  <table class="tbl"><tr><th>步驟</th><th style="text-align:left">做什麼</th></tr>
  <tr><td>① 保障</td><td style="text-align:left">45／65／80 歲續保（每張 1，長照險與年金險 80 歲免）；65 歲起年金：金錢或幸福＋1；最多買 1 張（健康≥7 折抵 1；健康≤3 醫療險／壽險重傷險加費 1）</td></tr>
  <tr><td>② 行動</td><td style="text-align:left">同時亮出 1 張行動卡並結算</td></tr>
  <tr><td>③ 檢查</td><td style="text-align:left">三軸都在 2–9：抽人生事件；否則抽失衡事件（離安全區最遠的那軸）</td></tr>
  <tr><td>④ 事件</td><td style="text-align:left">依卡面結算；有可理賠代碼且有有效保障，可啟動 1 張。壽險重傷險、長照險可取消停滯但為一次性；長照險理賠時健康＋1。失衡事件後仍在區外：回到 3（低）或 9（高）</td></tr>
  <tr><td>⑤ 成長</td><td style="text-align:left">沒停滯就前進 5 歲（95→100 需三軸皆在 2–9），停滯則不動；不論是否前進，任一軸＋1</td></tr></table>
  <p class="muted" style="margin-top:8px"><b>計分：</b>三軸合計＋2×最低軸＋2×有效保障（最多 5 張）＋人生目標（3／1／0）。同輪抵達者比品質分，再比最低軸，仍相同則共同獲勝。</p>
  <div class="opts"><button class="opt" data-v="ok" style="text-align:center"><b>關閉</b></button></div>`);
}

/* ---------- 復盤 ---------- */
function questions(p) {
  const q = []; const act = activeCodes(p); const goal = DATA.GOALS.find((g) => g.id === p.goal);
  if (p.unins >= 2) q.push([9, `你遇到了 ${p.unins} 次「不可保」的事件。如果發生在現實裡，你原本是怎麼準備的？誰會是你的第一道支持？`]);
  if (p.fails >= 2) q.push([8, `你被迫面對 ${p.fails} 次失衡事件。哪一條軸最常被你犧牲？現實中，是誰在替你補這個缺口？`]);
  if (p.stallsCanceled >= 1) q.push([8, `你用定額給付型保障取消過 ${p.stallsCanceled} 次停滯。你買到的是錢還是時間？現實中，你最缺的是哪一個？`]);
  if (p.stalls >= 3) q.push([7, `你停滯了 ${p.stalls} 次。當時間被卡住時，你最希望身邊有誰、有什麼資源？`]);
  if (Object.keys(p.prot).length === 0) q.push([9, '整局你都沒有保障。沒有保障時，你的第一道防線是現金、家人，還是健康？這道防線撐得了多久？']);
  if (p.firstBuyAge !== null && p.firstBuyAge >= 45) q.push([7, `你到 ${p.firstBuyAge} 歲才第一次投保。如果提早二十年開始準備，你的選擇會有什麼不同？`]);
  if (p.paid >= 10) q.push([6, `你一共付出 ${p.paid} 點保費。多少保障才不會壓垮你的現金流？現實中你怎麼判斷「剛剛好」？`]);
  if (!act.includes('L') && !act.includes('R')) q.push([6, '活到 100 歲，誰來照顧你？你的現金流夠不夠撐到那一天？']);
  if (p.spillUsed >= 1) q.push([5, `你有 ${p.spillUsed} 次因為健康好而少付保費。在現實裡，「健康」可以為你換到什麼？`]);
  if (p.m <= 3) q.push([5, '你的金錢在結尾偏低。你願意為了什麼讓它再低一點？又為了什麼要把它拉回來？']);
  if (goal) q.push([4, `你的人生目標是「${goal.name}」。${goal.ask}`]);
  q.push([2, '哪一個選擇你明知道不好還是選了？當時你在換什麼？'], [2, '哪一次事件最讓你意外？它是可保的，還是不可保的？'], [1, '遊戲中的三軸，哪一軸在現實裡最容易被你忽略？']);
  return q.sort((a, b) => b[0] - a[0]).slice(0, 3).map((x) => x[1]);
}
function chart(p) {
  const H = p.history, W = 640, Ht = 230, L = 34, B = 24, n = Math.max(1, H.length - 1); const x = (i) => L + (W - L - 8) * i / n, y = (v) => Ht - B - (Ht - B - 10) * v / 12;
  let s = `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto"><rect x="${L}" y="${y(9)}" width="${W - L - 8}" height="${y(2) - y(9)}" fill="var(--safe)"/>`;
  for (const v of [0, 2, 4, 6, 8, 10, 12]) s += `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text><line x1="${L}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width=".6"/>`;
  [['h', 'var(--green)'], ['f', 'var(--orange)'], ['m', 'var(--blue)']].forEach(([k, c]) => { s += `<polyline fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round" points="${H.map((r, i) => x(i) + ',' + y(r[k])).join(' ')}"/>`; });
  H.forEach((r, i) => { if (r.stalled) s += `<circle cx="${x(i)}" cy="${Ht - B + 8}" r="4" fill="var(--red)"/>`; if (i % 2 === 0 || i === H.length - 1) s += `<text x="${x(i)}" y="${Ht - 4}" text-anchor="middle" font-size="10" fill="var(--sub)">${i}</text>`; });
  return s + '</svg><div class="legend"><span><i style="background:var(--green)"></i>健康</span><span><i style="background:var(--orange)"></i>幸福</span><span><i style="background:var(--blue)"></i>金錢</span><span><i style="background:var(--safe)"></i>安全區</span><span><i style="background:var(--red);border-radius:50%"></i>停滯</span><span>橫軸：輪次（每輪＝5年）</span></div>';
}
function showReview(sel) {
  const G = S.G; const P = G.P; const isCh = (p) => G.champions.includes(p);
  const rows = [...P].sort((a, b) => finalScore(b).total - finalScore(a).total).map((p) => { const f = finalScore(p); const g = DATA.GOALS.find((x) => x.id === p.goal); return `<tr class="${isCh(p) ? 'win' : ''}"><td>${isCh(p) ? '🏆 ' : ''}${esc(p.name)}<br><span class="muted">${DATA.ROLES[p.role].short}</span></td><td>${p.age}</td><td>${p.h}／${p.f}／${p.m}</td><td>${activeCodes(p).map((c) => chip(c)).join('') || '—'}</td><td>${f.base}</td><td>${f.goal}<br><span class="muted">${g.name}</span></td><td><b>${f.total}</b></td></tr>`; }).join('');
  const me = sel !== undefined ? P[sel] : (humans()[0] || P[0]); const idx = P.indexOf(me); const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const win = G.champions.map((p) => esc(p.name)).join('、'); const first = G.winners.length;
  $('#main').innerHTML = `<div class="card pad"><h2>🏁 遊戲結束：${first ? win + (G.champions.length > 1 ? ' 共同獲勝' : ' 獲勝') : '無人登頂，以年齡與品質分排序'}</h2><p class="muted">第 ${G.round} 輪結束。${G.tie ? '本輪有多位玩家同時抵達，依品質分、再依最低軸決勝。' : ''}</p><table class="tbl"><tr><th>玩家</th><th>年齡</th><th>H／F／M</th><th>有效保障</th><th>基本分</th><th>目標</th><th>總分</th></tr>${rows}</table><p class="muted">基本分＝三軸合計＋2×最低軸＋2×有效保障（最多5張）。人生目標在此時公開。</p></div>
  <div class="card pad" style="margin-top:12px"><div class="row"><h2 style="margin:0">復盤報告</h2><div class="seg" id="segP">${P.map((p, i) => `<button data-i="${i}" class="${i === idx ? 'on' : ''}">${esc(p.name)}</button>`).join('')}</div></div>
  <h3 style="margin-top:12px">三軸走勢</h3>${chart(me)}
  <h3 style="margin-top:12px">這局你的數字</h3><div class="stats">${st(me.claimTotal, '理賠減免金額')}${st(me.paid, '保費與續保支出')}${st(me.unins, '不可保損失事件')}${st(me.stalls, '停滯次數')}${st(me.stallsCanceled, '取消停滯')}${st(me.fails, '失衡事件')}${st(me.spillUsed, '外溢折抵')}${st(me.firstBuyAge === null ? '—' : me.firstBuyAge, '首次投保年齡')}</div>
  <h3 style="margin-top:12px">我的三個提問</h3>${questions(me).map((t, i) => `<div class="qbox">${i + 1}. ${esc(t)}</div>`).join('')}
  <h3 style="margin-top:12px">回到現實，我會做的一件小事</h3><textarea id="pledge" placeholder="例如：這週和家人聊一次「如果需要被照顧，我們怎麼分工」。"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="copy">複製提問與承諾</button><button class="btn" id="print">列印</button><span class="muted" id="cmsg"></span></div><p class="muted">資料只存在你的瀏覽器，不會上傳。</p></div>
  <div class="row" style="margin-top:12px" id="noprint"><button class="btn pri big" id="again">再玩一局</button><button class="btn" id="back">回到設定</button></div>`;
  $('#segP').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) showReview(+b.dataset.i); };
  const ta = $('#pledge'); ta.value = store.get('ns100.pledge.' + idx, ''); ta.oninput = () => store.set('ns100.pledge.' + idx, ta.value);
  $('#copy').onclick = async () => { const text = `【我的三個提問｜百歲人生：平衡之路】\n${questions(me).map((t, i) => (i + 1) + '. ' + t).join('\n')}\n\n【我會做的一件小事】\n${ta.value || '（尚未填寫）'}`; try { await navigator.clipboard.writeText(text); $('#cmsg').textContent = '已複製'; } catch (e) { ta.select(); $('#cmsg').textContent = '請手動複製'; } };
  $('#print').onclick = () => { try { window.print(); } catch (e) { $('#cmsg').textContent = '請使用瀏覽器的列印功能'; } }; $('#again').onclick = () => { setupScreen(); startGame(); }; $('#back').onclick = setupScreen;
  window.scrollTo(0, 0);
}

/* ---------- 啟動 ---------- */
function syncFacBtn() { const b = $('#btnFac'); b.classList.toggle('on', S.facilOn); b.textContent = S.facilOn ? '引導師：開' : '引導師：關'; renderFacil(); }
$('#btnFac').onclick = () => { S.facilOn = !S.facilOn; store.set('ns100.facil', S.facilOn); syncFacBtn(); const f = $('#fa'); if (f) f.checked = S.facilOn; };
$('#btnRules').onclick = showRules; $('#btnTheme').onclick = () => { const r = document.documentElement; const dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', dark ? 'light' : 'dark'); store.set('ns100.theme', dark ? 'light' : 'dark'); };
$('#btnHome').onclick = async () => { if (S.G && !S.G.over) { const v = await ask('<h2>放棄這一局？</h2><p class="muted">目前進度不會保留。</p><div class="opts"><button class="opt" data-v="yes"><b>放棄並回到首頁</b></button><button class="opt" data-v="no"><b>繼續遊戲</b></button></div>'); if (v !== 'yes') return; } location.reload(); };
{ const t = store.get('ns100.theme', null); if (t) document.documentElement.setAttribute('data-theme', t); }
syncFacBtn(); setupScreen();
window.__app = { S, ui, startGame, setupScreen };

</script>
</body>
</html>
